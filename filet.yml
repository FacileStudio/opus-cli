# opus-cli's coding standard, enforced by filet.
# https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet roast .     the rules, with commentary
#   filet test .      the cargo suite
#
# filet has no Rust-specific rule family the way it has `go.*`. What runs here
# is the generic set (`gen.*`) plus the architecture rules, so treat this file
# as a layout contract with a size budget attached, not as a clippy substitute.
# `cargo clippy` still owns anything that needs to understand Rust.
#
# The limits are the Go family's canonical numbers, kept so one standard covers
# the suite. They are not picked to make a count go away.

ignore:
  - .git
  - target
  - dist
  - build
  - coverage

extensions: [.rs]

limits:
  fileLines: 300
  funcsPerFile: 0
  funcLines: 60
  funcStatements: 40
  lineLength: 120
  params: 5
  returns: 3
  nesting: 5
  complexity: 15
  structFields: 15
  interfaceMethods: 5

# Three layers, and the directories say which is which. src/opus/ and
# src/opus_client/ talk to the Opus API and own the models; src/cli/ is the
# scriptable non-interactive surface; src/tui/ is the ratatui app, split into
# app state, event handlers, modals, pickers and the render pass under ui/.
architecture:
  requiredDirs: [src, src/cli, src/opus, src/opus_client, src/tui, src/tui/app, src/tui/ui, src/tui/modals, src/tui/pickers, docs]
  requiredFiles:
    "src": [main.rs, lib.rs, config.rs, ui.rs]
    "src/cli": [mod.rs, output.rs]
    "src/opus": [mod.rs, client.rs, models.rs]
    "src/tui": [mod.rs, events.rs, handlers.rs]
    "src/tui/app": [mod.rs, state.rs]
    "src/tui/ui": [mod.rs, main.rs]
    "src/tui/modals": [mod.rs]
    "src/tui/pickers": [mod.rs]
    "docs": [README.md, architecture.md, configuration.md, development.md, usage.md]

style:
  banInlineComments: true
  banTODO: true
  requireDocComments: true
  banGlobalMutable: true
  banInit: true
  banTrailingSpace: true

disabled:
  - gen.line.long

failOn: error
