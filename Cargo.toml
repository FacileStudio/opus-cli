[package]
name = "opus-cli"
version = "0.1.0"
edition = "2021"
description = "Terminal User Interface for Opus project management"

[lib]
name = "opus_cli"
path = "src/lib.rs"

[[bin]]
name = "opus"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.26.0", features = ["all-widgets"] }
crossterm = "0.27.0"
reqwest = { version = "0.12.2", features = ["json", "blocking", "multipart"] }
tokio = { version = "1.36.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dotenv = "0.15.0"
clap = { version = "4.5", features = ["env"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
itertools = "0.12"
fuzzy-matcher = "0.3"
dirs = "5.0"
anyhow = "1.0"
open = "5"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono-english = "0.1"
aho-corasick = "1"

[dev-dependencies]
proptest = "1.0"
lazy_static = "1.4"
