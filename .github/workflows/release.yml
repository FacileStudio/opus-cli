name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os_name }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: x86_64-apple-darwin
            os_name: darwin
            arch: amd64
          - runner: macos-latest
            target: aarch64-apple-darwin
            os_name: darwin
            arch: arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: amd64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="opus_${version}_${{ matrix.os_name }}_${{ matrix.arch }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" opus
          mkdir -p dist
          mv "$archive" dist/

      - uses: actions/upload-artifact@v7
        with:
          name: opus-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt


  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Push Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/FacileStudio/opus-cli/releases/download/${GITHUB_REF_NAME}"

          gh release download "$GITHUB_REF_NAME" --pattern 'checksums.txt'
          sha() { grep "opus_${version}_$1.tar.gz" checksums.txt | awk '{print $1}'; }

          {
            echo "class Opus < Formula"
            echo "  desc \"Keyboard-driven terminal client for Opus project management\""
            echo "  homepage \"https://github.com/FacileStudio/opus-cli\""
            echo "  version \"${version}\""
            echo ""
            echo "  on_macos do"
            echo "    if Hardware::CPU.arm?"
            echo "      url \"${base}/opus_${version}_darwin_arm64.tar.gz\""
            echo "      sha256 \"$(sha darwin_arm64)\""
            echo "    else"
            echo "      url \"${base}/opus_${version}_darwin_amd64.tar.gz\""
            echo "      sha256 \"$(sha darwin_amd64)\""
            echo "    end"
            echo "  end"
            echo ""
            echo "  on_linux do"
            echo "    if Hardware::CPU.intel?"
            echo "      url \"${base}/opus_${version}_linux_amd64.tar.gz\""
            echo "      sha256 \"$(sha linux_amd64)\""
            echo "    else"
            echo "      url \"${base}/opus_${version}_linux_arm64.tar.gz\""
            echo "      sha256 \"$(sha linux_arm64)\""
            echo "    end"
            echo "  end"
            echo ""
            echo "  def install"
            echo "    bin.install \"opus\""
            echo "  end"
            echo ""
            echo "  test do"
            echo "    system \"#{bin}/opus\", \"--version\""
            echo "  end"
            echo "end"
          } > formula.rb

          git clone -q https://x-access-token:${GH_TOKEN}@github.com/FacileStudio/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp formula.rb "tap/Formula/opus.rb"
          cd tap
          git config user.name goreleaserbot
          git config user.email bot@goreleaser.com
          git add "Formula/opus.rb"
          git commit -m "opus ${version}"
          git push
